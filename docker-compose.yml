# Ember AI — local container runs.
#
#   docker compose up --build            # production build, http://localhost:3000/emberai
#   BASE_PATH="" docker compose up --build   # serve at http://localhost:3000/
#   docker compose --profile dev up      # hot-reload dev server on :3001
#
# BASE_PATH is a BUILD arg, not a runtime one: next.config.ts inlines it into
# the client bundle. Changing it requires a rebuild (--build).

services:
  ember-ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NEXT_PUBLIC_BASE_PATH: ${BASE_PATH-/emberai}
    image: ember-ai:local
    container_name: ember-ai
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LAYA_URL: http://laya:8000
      # BYOK by design: no key needed here. Visitors add their own Fireworks
      # key in Settings and it is sent per-request, never stored server-side.
      #
      # To run a shared-key demo instead, uncomment BOTH — in production
      # sharedKeyAllowed() ignores the key without the explicit opt-in:
      # FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      # ALLOW_SHARED_KEY: "true"
    depends_on: [laya]
    restart: unless-stopped

  # Laya — the prompt classifier behind the router. Internal only: the app
  # reaches it at http://laya:8000; it is never published to the internet.
  # English weights (~800MB) are baked into the image at build time, so it
  # starts offline. If Laya is down or slow, the app falls back to keywords.
  laya:
    build:
      context: ./laya
      # Optional: HF_TOKEN=hf_xxx speeds up the weight download during build.
      secrets: [hf_token]
    image: ${LAYA_IMAGE:-ember-laya:local}
    container_name: laya
    environment:
      LAYA_THREADS: ${LAYA_THREADS:-2}
    expose:
      - "8000"
    restart: unless-stopped

  # Optional: source-mounted dev server with hot reload. Opt in with
  # `docker compose --profile dev up`; it does not run by default.
  ember-ai-dev:
    profiles: ["dev"]
    image: ${NODE_IMAGE:-node:22-alpine}
    container_name: ember-ai-dev
    working_dir: /app
    command: sh -c "[ -d node_modules/.bin ] || npm ci; exec npm run dev -- -H 0.0.0.0 -p 3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BASE_PATH: ${BASE_PATH-/emberai}
      # In development sharedKeyAllowed() returns true, so a key here is used
      # as a fallback when the browser has none:
      # FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
    ports:
      - "${DEV_PORT:-3001}:3000"
    volumes:
      - .:/app
      # Anonymous volumes so the host bind mount (which has no node_modules
      # or .next) doesn't shadow what the container installs and builds.
      - /app/node_modules
      - /app/.next

secrets:
  hf_token:
    environment: HF_TOKEN
